# Include inside the existing raines.io port-80 VirtualHost, replacing its Redirect.
# Keep this file outside the symlinked releases so HTTP policy survives rollback.
RewriteEngine On
RewriteRule ^/index\.html$ https://raines.io/ [R=301,L]
RewriteCond %{THE_REQUEST} \s/+([^?\s]*)
RewriteRule ^ https://raines.io/%1 [R=301,L,NE]
